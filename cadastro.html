<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Delivery SUS</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cadastro-container">
        <div class="cadastro-box">
            <div class="cadastro-header">
                <a href="../index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div class="logo">
                    <i class="fas fa-heartbeat"></i>
                    <h1>Delivery SUS</h1>
                </div>
                <h2>Criar Nova Conta</h2>
                <p>Preencha seus dados para se cadastrar</p>
            </div>

            <!-- Progress Steps -->
            <div class="progress-steps">
                <div class="step active">
                    <div class="step-number">1</div>
                    <span>Dados Pessoais</span>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <span>Endereço</span>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <span>Senha</span>
                </div>
            </div>

            <form id="formCadastro" class="cadastro-form">
                <!-- Passo 1: Dados Pessoais -->
                <div class="form-step active" data-step="1">
                    <h3>Dados Pessoais</h3>
                    
                    <div class="form-group">
                        <label for="nomeCompleto">
                            <i class="fas fa-user"></i>
                            Nome Completo
                        </label>
                        <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cpf">
                                <i class="fas fa-id-card"></i>
                                CPF
                            </label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                        </div>

                        <div class="form-group">
                            <label for="dataNascimento">
                                <i class="fas fa-calendar"></i>
                                Data de Nascimento
                            </label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefone">
                                <i class="fas fa-phone"></i>
                                Telefone
                            </label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i>
                                E-mail
                            </label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="condicao">
                            <i class="fas fa-wheelchair"></i>
                            Condição de Mobilidade
                            </label>
                        <select id="condicao" name="condicao" required>
                            <option value="">Selecione sua condição</option>
                            <option value="idoso">Idoso (60+ anos)</option>
                            <option value="deficiencia">Pessoa com Deficiência Física</option>
                            <option value="mobilidade_reduzida">Mobilidade Reduzida</option>
                            <option value="tratamento">Paciente em Tratamento Contínuo</option>
                        </select>
                    </div>

                    <button type="button" class="btn btn-primary btn-next">
                        Próximo
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <!-- Passo 2: Endereço -->
                <div class="form-step" data-step="2">
                    <h3>Endereço de Entrega</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cep">
                                <i class="fas fa-map-pin"></i>
                                CEP
                            </label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                        </div>

                        <div class="form-group">
                            <button type="button" class="btn btn-secondary btn-buscar-cep">
                                <i class="fas fa-search"></i>
                                Buscar CEP
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rua">
                            <i class="fas fa-road"></i>
                            Rua
                        </label>
                        <input type="text" id="rua" name="rua" placeholder="Nome da rua" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="numero">
                                <i class="fas fa-home"></i>
                                Número
                            </label>
                            <input type="text" id="numero" name="numero" placeholder="Nº" required>
                        </div>

                        <div class="form-group">
                            <label for="complemento">
                                <i class="fas fa-building"></i>
                                Complemento
                            </label>
                            <input type="text" id="complemento" name="complemento" placeholder="Apto, Casa, etc.">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="bairro">
                                <i class="fas fa-map"></i>
                                Bairro
                            </label>
                            <input type="text" id="bairro" name="bairro" placeholder="Bairro" required>
                        </div>

                        <div class="form-group">
                            <label for="cidade">
                                <i class="fas fa-city"></i>
                                Cidade
                            </label>
                            <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="referencia">
                            <i class="fas fa-info-circle"></i>
                            Ponto de Referência
                        </label>
                        <input type="text" id="referencia" name="referencia" placeholder="Ex: Próximo ao mercado X">
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn btn-secondary btn-prev">
                            <i class="fas fa-arrow-left"></i>
                            Anterior
                        </button>
                        <button type="button" class="btn btn-primary btn-next">
                            Próximo
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Passo 3: Senha -->
                <div class="form-step" data-step="3">
                    <h3>Criar Senha de Acesso</h3>

                    <div class="form-group">
                        <label for="senha">
                            <i class="fas fa-lock"></i>
                            Senha
                        </label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
                        <small class="form-hint">Utilize pelo menos 6 caracteres com letras e números</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmarSenha">
                            <i class="fas fa-lock"></i>
                            Confirmar Senha
                        </label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" required>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="termos" required>
                            <span>Eu li e concordo com os <a href="#" class="link">Termos de Uso</a> e <a href="#" class="link">Política de Privacidade</a></span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="notificacoes">
                            <span>Desejo receber notificações sobre minhas entregas</span>
                        </label>
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn btn-secondary btn-prev">
                            <i class="fas fa-arrow-left"></i>
                            Anterior
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i>
                            Finalizar Cadastro
                        </button>
                    </div>
                </div>
            </form>

            <div class="cadastro-footer">
                <p>Já possui uma conta? <a href="login.html" class="link">Fazer Login</a></p>
            </div>
        </div>
    </div>

    <script src="../scripts/cadastro.js"></script>
</body>
</html>
